[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0.102"
memmap2 = "0.9.10"
roxmltree = "0.20.0"
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app",
    "default_platform",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "tonemapping_luts",
    "bevy_audio",
    "mp3",
    "wav",
] }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
