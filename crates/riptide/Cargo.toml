[package]
name = "riptide"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
bevy.workspace = true
riptide-assets = { path = "../riptide-assets" }

[build-dependencies]
riptide-sheets = { path = "../riptide-sheets" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["File", "Blob"] }
